<main
  class="status-page"
  [class.status-page--not-found]="kind() === 'not-found'"
  [class.status-page--unavailable]="kind() === 'unavailable'"
  [class.status-page--forbidden]="kind() === 'forbidden'"
>
  <mat-card appearance="outlined" class="status-page__card" aria-labelledby="status-page-title">
    <div class="status-page__trace" aria-hidden="true">
      <svg viewBox="0 0 320 24" fill="none" preserveAspectRatio="none">
        <path
          d="M0 12h26l6-9 8 18 6-12 5 9 4-6h22l6-9 8 18 6-12 5 9 4-6h22l6-9 8 18 6-12 5 9 4-6h24"
        />
      </svg>
    </div>
    <mat-card-content>
      <div class="status-page__reading" aria-hidden="true">
        <span class="status-page__code">{{ code() }}</span>
        <span class="status-page__label">{{ codeLabel() }}</span>
      </div>
      <mat-chip-set aria-label="Estado de la aplicación">
        <mat-chip class="status-page__chip">
          <i class="nexa-live-dot" aria-hidden="true"></i>
          NexaSalud · acceso protegido
        </mat-chip>
      </mat-chip-set>
      <h1 id="status-page-title">{{ title() }}</h1>
      <p class="status-page__description">{{ description() }}</p>
      <mat-divider />
      <div class="status-page__actions">
        @if (kind() === 'forbidden') {
          <button mat-flat-button type="button" class="status-page__primary" (click)="signOut()">
            Cerrar sesión
          </button>
        } @else {
          <button
            mat-flat-button
            type="button"
            class="status-page__primary"
            (click)="returnToWorkspace()"
          >
            Volver al espacio de trabajo
          </button>
          <a mat-stroked-button routerLink="/login">Ir al acceso seguro</a>
        }
      </div>
      <p class="status-page__support">
        <app-icon name="shield" [size]="14" />
        <span>
          Si el problema continúa, contacta con soporte autorizado e indica la hora aproximada del
          incidente.
        </span>
      </p>
    </mat-card-content>
  </mat-card>
</main>
