name: ${COMPOSE_PROJECT_NAME:-nexasalud-production}

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  gateway:
    <<: *service-security
    build:
      context: ../..
      dockerfile: infra/production/gateway.Dockerfile
    image: ${GATEWAY_IMAGE:-nexasalud-gateway:release}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8080'
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,uid=101,gid=101

  api:
    <<: *service-security
    image: ${API_IMAGE:?Set API_IMAGE to an immutable production image digest}
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    networks:
      - edge
      - backend
    read_only: true
    volumes:
      - api-storage:/var/www/html/storage
      - api-bootstrap-cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001

  worker:
    <<: *service-security
    image: ${API_IMAGE:?Set API_IMAGE to an immutable production image digest}
    command:
      [
        'php',
        'artisan',
        'queue:work',
        'redis',
        '--queue=communications',
        '--sleep=1',
        '--tries=3',
        '--backoff=10,60,300',
        '--timeout=30',
        '--max-time=3600',
        '--no-interaction',
      ]
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    networks:
      - backend
    read_only: true
    volumes:
      - worker-bootstrap-cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001
    healthcheck:
      test: ['CMD-SHELL', "ps -o args= | grep -q '[p]hp artisan queue:work redis --queue=communications'"]
      interval: 15s
      timeout: 4s
      start_period: 20s
      retries: 3

networks:
  edge:
  backend:
    internal: true

volumes:
  api-storage:
  api-bootstrap-cache:
  worker-bootstrap-cache:
