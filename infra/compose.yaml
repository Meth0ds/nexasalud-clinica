name: ${COMPOSE_PROJECT_NAME:-nexasalud-local}

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-api-environment: &api-environment
  APP_NAME: NexaSalud
  APP_ENV: local
  APP_KEY: ${APP_KEY:?Run infra/scripts/init.sh first}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: http://localhost:${API_HTTP_PORT:-8000}
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-nexasalud}
  DB_USERNAME: ${APP_DB_USERNAME:-nexasalud_app}
  DB_PASSWORD: ${APP_DB_PASSWORD:?Run infra/scripts/init.sh first}
  DB_SSLMODE: disable
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Run infra/scripts/init.sh first}
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  SESSION_LIFETIME: 15
  SESSION_ENCRYPT: 'true'
  SESSION_EXPIRE_ON_CLOSE: 'true'
  SESSION_HTTP_ONLY: 'true'
  SESSION_SECURE_COOKIE: 'false'
  SESSION_SAME_SITE: lax
  SESSION_COOKIE: nexasalud_local_session
  SANCTUM_STATEFUL_DOMAINS: localhost:4200,127.0.0.1:4200,localhost:8000,127.0.0.1:8000
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
  MAIL_MAILER: smtp
  MAIL_SCHEME: ''
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: no-reply@nexasalud.example.test
  MAIL_FROM_NAME: NexaSalud
  KEYCLOAK_BASE_URL: http://keycloak.localhost:${KEYCLOAK_HTTP_PORT:-8080}
  KEYCLOAK_REALM: nexasalud-dev
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-nexasalud-bff}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Run infra/scripts/init.sh first}
  KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Run infra/scripts/init.sh first}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Run infra/scripts/init.sh first}
  KEYCLOAK_REDIRECT_URI: http://localhost:${API_HTTP_PORT:-8000}/auth/callback
  OIDC_ISSUER: http://keycloak.localhost:${KEYCLOAK_HTTP_PORT:-8080}/realms/nexasalud-dev
  OIDC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-nexasalud-bff}
  OIDC_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Run infra/scripts/init.sh first}
  OIDC_REDIRECT_URI: http://localhost:${API_HTTP_PORT:-8000}/auth/callback
  OIDC_FRONTEND_URL: http://localhost:4200
  OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:4200/login
  OIDC_UPSTREAM_LOGOUT: 'true'
  OIDC_ALLOWED_ALGORITHMS: RS256
  OIDC_TRANSACTION_TTL_SECONDS: 300
  OIDC_DISCOVERY_CACHE_SECONDS: 300
  OIDC_JWKS_CACHE_SECONDS: 600
  OIDC_CONNECT_TIMEOUT_SECONDS: 2
  OIDC_TIMEOUT_SECONDS: 5
  OIDC_CLOCK_SKEW_SECONDS: 60
  OIDC_REQUIRED_ACR_VALUES: '2'
  OIDC_REQUIRED_AMR_VALUES: otp
  OIDC_ALLOW_INSECURE_HTTP: 'true'
  # Demonstration-only medication/PDF flows must be explicitly enabled locally.
  DEMO_PORTAL_SIMULATIONS: ${DEMO_PORTAL_SIMULATIONS:-false}
  CLINICAL_PDF_ASYNC: ${CLINICAL_PDF_ASYNC:-false}
  CLINICAL_PDF_QUEUE: ${CLINICAL_PDF_QUEUE:-clinical-pdf}
  CLINICAL_PDF_TIMEOUT_SECONDS: ${CLINICAL_PDF_TIMEOUT_SECONDS:-60}
  CLINICAL_PDF_RETRY_AFTER_SECONDS: ${CLINICAL_PDF_RETRY_AFTER_SECONDS:-90}
  CLINICAL_PDF_MAX_ATTEMPTS: ${CLINICAL_PDF_MAX_ATTEMPTS:-3}
  CLINICAL_PDF_MAX_PENDING_PER_ACTOR: ${CLINICAL_PDF_MAX_PENDING_PER_ACTOR:-3}
  CLINICAL_PDF_MAX_CONCURRENT_PER_CLINIC: ${CLINICAL_PDF_MAX_CONCURRENT_PER_CLINIC:-1}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

services:
  gateway:
    <<: *service-security
    image: nginxinc/nginx-unprivileged:1.28-alpine
    user: '101:101'
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_HTTP_PORT:-8000}:8080'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/api/public:/var/www/html/public:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,uid=101,gid=101
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 3 -O /dev/null http://127.0.0.1:8080/ready || exit 1']
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 6

  api:
    <<: *service-security
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: development
      args:
        PHP_VERSION: '8.4'
        APP_UID: '10001'
        APP_GID: '10001'
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - edge
      - backend
      - mail
    read_only: true
    volumes:
      - api-storage:/var/www/html/storage
      - api-bootstrap-cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong || exit 1',
        ]
      interval: 10s
      timeout: 4s
      start_period: 30s
      retries: 6

  worker:
    <<: *service-security
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: development
      args:
        PHP_VERSION: '8.4'
        APP_UID: '10001'
        APP_GID: '10001'
    command:
      [
        'php',
        'artisan',
        'queue:work',
        'redis',
        '--queue=communications',
        '--sleep=1',
        '--tries=3',
        '--backoff=10,60,300',
        '--timeout=30',
        '--max-time=3600',
        '--no-interaction',
      ]
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    volumes:
      - api-worker-bootstrap-cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "ps -o args= | grep -q '[p]hp artisan queue:work redis --queue=communications'",
        ]
      interval: 15s
      timeout: 4s
      start_period: 20s
      retries: 3

  pdf-worker:
    <<: *service-security
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: development
      args:
        PHP_VERSION: '8.4'
        APP_UID: '10001'
        APP_GID: '10001'
    command:
      [
        'php',
        'artisan',
        'queue:work',
        'redis',
        '--queue=clinical-pdf',
        '--sleep=1',
        '--tries=3',
        '--backoff=5,15,30',
        '--timeout=75',
        '--max-jobs=100',
        '--max-time=3600',
        '--no-interaction',
      ]
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    volumes:
      - api-pdf-worker-bootstrap-cache:/var/www/html/bootstrap/cache
      - api-storage:/var/www/html/storage
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001
    deploy:
      resources:
        limits:
          cpus: '${PDF_WORKER_CPU_LIMIT:-1.0}'
          memory: '${PDF_WORKER_MEMORY_LIMIT:-512M}'
          pids: 128
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "ps -o args= | grep -q '[p]hp artisan queue:work redis --queue=clinical-pdf'",
        ]
      interval: 15s
      timeout: 4s
      start_period: 20s
      retries: 3

  postgres:
    <<: *service-security
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Run infra/scripts/init.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-nexasalud}
      APP_DB_USERNAME: ${APP_DB_USERNAME:-nexasalud_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run infra/scripts/init.sh first}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak_app}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run infra/scripts/init.sh first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer --data-checksums
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/00-provision-databases.sh:/docker-entrypoint-initdb.d/00-provision-databases.sh:ro
    networks:
      - backend
      - tooling
    shm_size: 256mb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$APP_DB_PASSWORD"
          psql -X -h 127.0.0.1 -U "$$APP_DB_USERNAME" -d "$$POSTGRES_DB"
          --set ON_ERROR_STOP=1 --tuples-only --command 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 12

  redis:
    <<: *service-security
    image: redis:8.0.2-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run infra/scripts/init.sh first}
    command: ['/opt/nexasalud/run-redis.sh']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
      - ./redis/run.sh:/opt/nexasalud/run-redis.sh:ro
    networks:
      - backend
      - tooling
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q ''^PONG$''']
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

  keycloak:
    <<: *service-security
    image: quay.io/keycloak/keycloak:26.6.3
    user: '1000:0'
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak_app}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run infra/scripts/init.sh first}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-local_admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Run infra/scripts/init.sh first}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: http://keycloak.localhost:${KEYCLOAK_HTTP_PORT:-8080}
      KC_HOSTNAME_STRICT: 'true'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_SPI_THEME_CACHE_THEMES: 'false'
      KC_SPI_THEME_CACHE_TEMPLATES: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - '127.0.0.1:${KEYCLOAK_HTTP_PORT:-8080}:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./data/keycloak/nexasalud-dev-realm.json:/opt/keycloak/data/import/nexasalud-dev-realm.json:ro
      - ./keycloak/themes/nexasalud:/opt/keycloak/themes/nexasalud:ro
    networks:
      edge:
        aliases:
          - keycloak.localhost
      backend:
        aliases:
          - keycloak.localhost
      mail: {}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status".*"UP"' <&3
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12

  mailpit:
    <<: *service-security
    image: axllent/mailpit:v1.27.8
    user: '65532:65532'
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: '0'
      MP_SMTP_AUTH_ALLOW_INSECURE: '0'
    ports:
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    networks:
      - edge
      - mail
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 6

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  mail:
    driver: bridge
    internal: true
  tooling:
    driver: bridge

volumes:
  api-storage:
  api-bootstrap-cache:
  api-worker-bootstrap-cache:
  api-pdf-worker-bootstrap-cache:
  postgres-data:
  redis-data:
  keycloak-data:
