<svg
  aria-hidden="true"
  fill="none"
  viewBox="0 0 24 24"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.aria-label]="label()"
  [attr.role]="label() ? 'img' : null"
>
  <path [attr.d]="path()" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" />
</svg>
